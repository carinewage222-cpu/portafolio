backend:
  name: git-gateway
  branch: main

media_folder: "images/obras"
public_folder: "images/obras"

collections:
  - name: "galeria"
    label: "Galería"
    files:
      - name: "obras"
        label: "Obras"
        file: "data/obras.json"
        fields:
          - label: "Obras"
            name: "obras"
            widget: "list"
            summary: "{{titulo}} — {{categoria}}"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - label: "Categoría"
                name: "categoria"
                widget: "select"
                options:
                  - { label: "Acuarelas", value: "acuarelas" }
                  - { label: "Dibujo digital", value: "dibujo-digital" }
                  - { label: "Pintura", value: "pintura" }
                  - { label: "Varios", value: "varios" }
              - { label: "Imagen", name: "imagen", widget: "image" }
              - { label: "Descripción", name: "descripcion", widget: "text", required: false }
              - { label: "Año", name: "anio", widget: "number", value_type: "int", min: 1900, max: 2100 }

  - name: "configuracion"
    label: "Configuración del sitio"
    files:
      - name: "config"
        label: "Portada (inicio)"
        file: "data/config.json"
        fields:
          - label: "Imagen de portada"
            name: "heroImagen"
            widget: "image"
            media_folder: "/images"
            public_folder: "images"
          - label: "Descripción de la imagen (accesibilidad)"
            name: "heroAlt"
            widget: "string"
